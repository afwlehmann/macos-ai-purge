name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = false

# macos-26: GitHub-hosted Apple silicon (aarch64-darwin) runner, matching the
# target host. GitHub offers no image with Nix preinstalled, so each job
# installs it first.
jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Evaluate flake
        run: nix flake check --no-build --print-build-logs

      - name: Run pre-commit hooks (nixfmt, statix, deadnix, actionlint, ripsecrets)
        run: nix build --print-build-logs --no-link .#checks.aarch64-darwin.pre-commit-check

      - name: Check Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: nix develop --command convco check "${BASE_SHA}..${HEAD_SHA}"

  build:
    needs: lint
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        example: [example-minimal, example-26, example-27]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Build activation package
        env:
          EXAMPLE: ${{ matrix.example }}
        run: nix build --print-build-logs --no-link ".#homeConfigurations.${EXAMPLE}.activationPackage"

      - name: Build and validate configuration profile
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          nix build --print-build-logs --out-link profile \
            ".#homeConfigurations.${EXAMPLE}.config.home.file.\"Library/Application Support/macos-ai-purge/macos-ai-purge.mobileconfig\".source"
          plutil -lint profile

  test:
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      # Lint, build and this step together cover every flake check, so no
      # separate full `nix flake check` (it would rebuild all of them).
      - name: Module tests
        run: nix build --print-build-logs --no-link .#checks.aarch64-darwin.module-tests
